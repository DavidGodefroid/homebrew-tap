name: bump

# Bumps one formula to a published release of its project:
#   - by hand: Actions > bump > Run workflow (formula, version);
#   - from a project's release workflow: a repository_dispatch of type
#     "bump" with the payload {"formula": "...", "version": "vX.Y.Z"},
#     sent with a token allowed to dispatch to this repository only.
# scripts/bump rewrites the formula from the release's signed
# checksums.txt (and verified image digests); the result is pushed to a bump
# branch, tested by tests.yml, then fast-forwarded onto main. Commits are made
# with this repository's GITHUB_TOKEN.

on:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula to bump
        required: true
        type: choice
        options: [lox, lea, locksql, lockmq, lockfile, lockhttp, locklog, lockssh]
      version:
        description: Release version (X.Y.Z or vX.Y.Z)
        required: true
        type: string
  repository_dispatch:
    types: [bump]

permissions:
  contents: read

# One bump at a time per formula. A group keeps a single pending run, so a
# shared group would cancel the bumps of other formulas sent at the same time
# (several projects releasing together); per formula, only an older pending
# bump of the same formula is replaced by the newer one.
concurrency:
  group: bump-${{ github.event.inputs.formula || github.event.client_payload.formula }}
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      branch: ${{ steps.commit.outputs.branch }}
      sha: ${{ steps.commit.outputs.sha }}
    env:
      FORMULA: ${{ github.event.inputs.formula || github.event.client_payload.formula }}
      VERSION: ${{ github.event.inputs.version || github.event.client_payload.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      # scripts/bump checks FORMULA and VERSION against fixed patterns before
      # using them, as they may come from a dispatch payload.
      - name: Rewrite the formula
        run: scripts/bump "$FORMULA" "$VERSION"

      - name: Commit to a bump branch
        id: commit
        run: |
          if git diff --quiet; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "$FORMULA is already at $VERSION" >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name DavidG
          git config user.email davidgodefroid@gmail.com
          version=${VERSION#v}
          git commit --quiet -am "feat($FORMULA): bump to $version" \
            -m "From the signed checksums.txt of the $FORMULA release v$version."
          branch="bump/$FORMULA-$version"
          git push --force origin "HEAD:refs/heads/$branch"
          {
            echo "changed=true"
            echo "branch=$branch"
            echo "sha=$(git rev-parse HEAD)"
          } >>"$GITHUB_OUTPUT"
          git show --stat HEAD >>"$GITHUB_STEP_SUMMARY"

  # Linux gates the publish. macOS is tested on every bump too, beside the
  # publish, and a failure shows in the run, but it never holds a bump back:
  # hosted macOS runners are too often not acquired.
  test:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
      os: '["ubuntu-latest"]'

  test-macos:
    needs: bump
    if: needs.bump.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}
      os: '["macos-latest"]'

  publish:
    needs: [bump, test]
    if: needs.bump.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ needs.bump.outputs.branch }}
      SHA: ${{ needs.bump.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # The tested commit changes one formula file only. If main moved
      # meanwhile (another formula's bump), replay it on top: a bump of
      # another formula touches another file, so the replay cannot conflict;
      # a conflict means main changed this formula, and the run fails.
      - name: Publish onto main
        run: |
          git config user.name DavidG
          git config user.email davidgodefroid@gmail.com
          git fetch origin "$SHA"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --quiet --hard origin/main
            if git merge-base --is-ancestor HEAD "$SHA"; then
              git merge --quiet --ff-only "$SHA"
            else
              git cherry-pick "$SHA"
            fi
            if git push origin HEAD:main; then
              git push origin --delete "$BRANCH"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not publish onto main after 5 attempts" >&2
          exit 1
