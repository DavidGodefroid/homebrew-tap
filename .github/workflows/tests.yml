name: tests

# Style and strict audit of the tap, then each formula installed from source
# and tested, on Linux and on macOS (arm64). bump.yml calls it on a bump
# branch before the bump reaches main.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or branch of the tap to test (default the triggering commit)
        type: string
        default: ""
      os:
        description: JSON list of runners (default Linux and macOS, Linux only on a pull request)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow_ref }}-${{ inputs.ref || github.ref }}-${{ inputs.os }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS does not run on pull requests: hosted macOS runners are too
        # often not acquired to gate a PR. bump.yml picks the runners itself.
        os: ${{ inputs.os != '' && fromJSON(inputs.os) || github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # 2026.10.12.1
        with:
          token: ${{ github.token }}

      - name: Check out the ref to test
        if: inputs.ref != ''
        working-directory: ${{ steps.set-up-homebrew.outputs.repository-path }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          git fetch origin "$REF"
          git checkout --force --detach FETCH_HEAD
          git log -1 --oneline

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - name: Strict audit
        run: brew audit --strict --online --tap davidgodefroid/tap

      - name: Install and test each formula
        run: |
          formulas=(lox lea locksql lockmq lockhttp)
          if [[ "$RUNNER_OS" == Linux ]]; then formulas+=(lockfile); fi
          for f in "${formulas[@]}"; do
            brew install --build-from-source --formula "davidgodefroid/tap/$f"
            brew test --verbose "davidgodefroid/tap/$f"
          done

      - name: Install and test the meta formula
        run: |
          brew install --formula davidgodefroid/tap/lockfamily
          brew test --verbose davidgodefroid/tap/lockfamily
          lox version
          lea version
          cosign version

  # A user's first install, with Homebrew's default settings: no test-bot
  # setup and no setup-homebrew action, which both trust the tap for us. The
  # tap is cloned from GitHub (its default remote, so `brew trust
  # davidgodefroid/tap` applies to it as it does for a user) and then moved to
  # the commit under test.
  fresh-install:
    strategy:
      fail-fast: false
      matrix:
        # macOS does not run on pull requests: hosted macOS runners are too
        # often not acquired to gate a PR. bump.yml picks the runners itself.
        os: ${{ inputs.os != '' && fromJSON(inputs.os) || github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    env:
      REF: ${{ inputs.ref || github.sha }}
    steps:
      - name: Put Homebrew on the PATH and update it
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
            export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          fi
          unset HOMEBREW_NO_REQUIRE_TAP_TRUST
          brew update
          brew --version
          brew trust

      - name: Tap from GitHub at the commit under test
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          unset HOMEBREW_NO_REQUIRE_TAP_TRUST
          brew tap davidgodefroid/tap
          tap_dir="$(brew --repository davidgodefroid/tap)"
          git -C "$tap_dir" fetch origin "$REF"
          git -C "$tap_dir" checkout --force --detach FETCH_HEAD
          git -C "$tap_dir" log -1 --oneline
          git -C "$tap_dir" remote get-url origin

      # Fails if Homebrew stops refusing a dependency from an untrusted tap:
      # then the documented `brew trust` step needs a second look.
      - name: Without trust, the install is refused
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          unset HOMEBREW_NO_REQUIRE_TAP_TRUST
          if brew install davidgodefroid/tap/lockfamily > untrusted.log 2>&1; then
            cat untrusted.log
            echo "::error::lockfamily installed from an untrusted tap"
            exit 1
          fi
          cat untrusted.log
          grep -q "from untrusted tap davidgodefroid/tap" untrusted.log

      - name: Trust the tap and install, as the README says
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          unset HOMEBREW_NO_REQUIRE_TAP_TRUST
          brew trust davidgodefroid/tap
          brew install davidgodefroid/tap/lockfamily
          lox version
          lea version
